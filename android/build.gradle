buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    compileSdkVersion = 36
    targetSdkVersion = 34
    minSdkVersion = 21
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    buildscript {
        configurations.all {
            resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    plugins.withId('com.android.library') {
        project.extensions.configure(com.android.build.gradle.LibraryExtension) { ext ->
            if (ext.namespace == null) {
                ext.namespace = "com.safeherven.plugin.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
            }
        }
    }

    plugins.withId('com.android.application') {
        project.extensions.configure(com.android.build.gradle.AppExtension) { ext ->
            if (ext.namespace == null) {
                ext.namespace = "com.safeherven.plugin.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
            }
        }
    }

    tasks.matching { it.name.startsWith("process") && it.name.endsWith("Manifest") }.configureEach { task ->
        task.doFirst {
            def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def content = manifestFile.text
                if (content.contains('package=')) {
                    manifestFile.write(content.replaceAll(/package="[^"]+"/, ''))
                }
            }
        }
    }
}

subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.hasProperty('android')) {
            subproject.android {
                compileSdk = 37
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            }
        }
        subproject.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = "17"
            targetCompatibility = "17"
        }
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

subprojects {
    if (project.name != 'app') {
        project.evaluationDependsOn(':app')
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
