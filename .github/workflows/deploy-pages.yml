name: Deploy Web (GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build functional prototype (Flutter Web)
        run: flutter build web --release --base-href /VozesLivres/app/

      - name: Assemble Pages site (landing page + embedded prototype)
        run: |
          set -e
          rm -rf site
          mkdir -p site/assets/images site/assets/icons site/app

          # Landing page (design) + its own small assets (e.g. QR code)
          cp -r docs/. site/

          # Screenshots used by the landing page, sourced from the Flutter assets
          cp assets/images/readme_images/01_tela_entrada.png site/assets/images/
          cp assets/images/readme_images/02_tela_home.png site/assets/images/
          cp assets/images/readme_images/03_tela_mapa.png site/assets/images/
          cp assets/images/readme_images/04_tela_ajuda_ongs.png site/assets/images/
          cp assets/images/readme_images/05_tela_chat.png site/assets/images/
          cp assets/images/readme_images/07_tela_alertas.png site/assets/images/

          # Favicon, also sourced from the Flutter web assets
          cp web/icons/Icon-192.png site/assets/icons/

          # Functional prototype (Flutter Web build), embedded as /app/ inside the site
          cp -r build/web/. site/app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
